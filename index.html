<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microduck 主动感知 · MuJoCo 场景复现</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3f4;color:#193c46;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1480px;margin:24px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:23px;font-weight:600;margin:0}header p{margin:4px 0;color:#69818a}.badge{border:1px solid #e3c99b;background:#fff6df;padding:7px 12px;border-radius:6px;color:#8b6421;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.viewer{background:#fff;border:1px solid #ccdae0;border-radius:10px;overflow:hidden}.viewport{display:grid;grid-template-columns:minmax(0,1fr) 180px;background:#102f3b;min-height:400px}.viewport>img{width:100%;height:100%;object-fit:contain;background:#18384b}.telemetry{color:#e4eff0;padding:17px 12px;font-size:12px}.telemetry p{margin:0 0 14px}.telemetry label{display:block;color:#a8c4cc;font-size:11px}#depth{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#35464a}button,select{font:inherit;padding:10px 14px;border:1px solid #bdd1d9;border-radius:6px;background:#fff;color:#225368;cursor:pointer}button:hover{background:#e9f4f3}.primary{background:#087c72;color:#fff;border-color:#087c72}.primary:hover{background:#07695f}.controls{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.spacer{flex:1}.panel{background:#fff;border:1px solid #d0dfe4;border-radius:10px;padding:20px}h2{font-size:18px;margin:0 0 20px}.item{margin:18px 0}.item label{display:block;font-size:12px;color:#78909c;margin-bottom:5px}.item strong{font-weight:500}#phase{color:#087c72;font-size:19px}.scans{border-top:1px solid #e2ebed;margin-top:22px;padding-top:12px}.scan{padding:8px 0;border-bottom:1px solid #e9eff1;font-size:12px}.foot{font-size:12px;color:#7b9199;margin-top:14px}.top{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}#scene{min-width:270px}#error{color:#b42318}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel h2,.scans{grid-column:1/-1}.viewport{grid-template-columns:minmax(0,1fr) 140px;min-height:300px}}@media(max-width:530px){main{padding:0 8px}header{display:block}.badge{display:inline-block;margin-top:8px}.viewport{grid-template-columns:1fr}.telemetry{display:grid;grid-template-columns:1fr 1fr;gap:8px}#depth{max-width:130px}.viewport>img{min-height:260px}}
</style></head><body><main>
<header><div><h1>Microduck 主动感知避障</h1><p>MuJoCo · 官方机器人模型 · 截图场景复现</p></div><span class="badge">脚本控制预演 · 未运行强化学习策略</span></header>
<div class="top"><select id="scene" aria-label="选择场景"><option value="0">场景 1 · 围墙与隔板（图一）</option><option value="1">场景 2 · T 形墙（图二）</option><option value="2">场景 3 · 三面障碍（图三）</option><option value="3">场景 4 · 交错墙连续观察</option></select><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="2">2 倍速</option><option value=".5">半速观察</option></select><span id="error" role="alert"></span></div>
<div class="layout"><section class="viewer"><div class="viewport"><img src="/stream" alt="MuJoCo 实时渲染的 Microduck 与橙色墙体"><div class="telemetry"><p>small_scan</p><p>SCRIPTED PREVIEW</p><p><label>sim t</label><span id="time">0.00 s</span></p><p><label>actual speed</label><span id="velocity">0.000 m/s</span></p><p><label>goal dist</label><span id="dist">—</span></p><p><label>head yaw</label><span id="yaw">0°</span></p><canvas id="depth" width="8" height="8" aria-label="8×8 模拟 ToF 距离图"></canvas><p style="margin-top:9px">red = near · green = far<br>gray = no valid return</p></div></div><div class="controls"><button id="play" class="primary">开始演示</button><button id="restart">重新开始</button><button id="next">下一场景</button><span class="spacer"></span><button id="overview">全景</button><button id="follow">跟随鸭子</button></div></section>
<aside class="panel"><h2>独立演示</h2><div class="item"><label>运行状态</label><strong id="phase" aria-live="polite">准备就绪</strong></div><div class="item"><label>场景名称</label><strong id="name">围墙隔板</strong></div><div class="item"><label>左侧 ToF</label><strong id="left">待观察</strong></div><div class="item"><label>右侧 ToF</label><strong id="right">待观察</strong></div><div class="item"><label>观察后的判断</label><strong id="choice">等待扫描</strong></div><div class="scans"><label>本回合观察记录</label><div id="history">尚未扫描</div></div></aside></div>
<p class="foot">官方 MJCF / STL 模型；MuJoCo 射线测距。底盘轨迹与步态为预设运动，头部独立转动。截图未提供精确尺寸，墙体按视觉比例重建。可点击「跟随鸭子」近距离看摆头。</p>
</main><script>
const $=id=>document.getElementById(id);async function command(action,extra={}){try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});if(!r.ok)throw Error(r.status);$('error').textContent='';}catch(e){$('error').textContent='连接中断，请重新启动本地演示。'}}
$('scene').onchange=()=>command('scene',{scene:+$('scene').value});$('speed').onchange=()=>command('speed',{rate:+$('speed').value});$('play').onclick=()=>command('play');$('restart').onclick=()=>command('restart');$('next').onclick=()=>{$('scene').value=(+$('scene').value+1)%4;command('scene',{scene:+$('scene').value})};$('overview').onclick=()=>command('view',{follow:false});$('follow').onclick=()=>command('view',{follow:true});
const dc=$('depth').getContext('2d');async function poll(){try{let s=await(await fetch('/state',{cache:'no-store'})).json();if(s.depth){$('time').textContent=s.elapsed.toFixed(2)+' s';$('velocity').textContent=s.speed.toFixed(3)+' m/s';$('dist').textContent=s.goal_distance.toFixed(3)+' m';$('yaw').textContent=s.head.toFixed(1)+'°';$('phase').textContent=s.phase;$('name').textContent=s.name;$('left').textContent=s.left===null?'待观察':s.left.toFixed(2)+' m';$('right').textContent=s.right===null?'待观察':s.right.toFixed(2)+' m';$('choice').textContent=s.choice?s.choice+'更空旷':'等待扫描';$('play').textContent=s.running?'暂停演示':'继续演示';$('history').replaceChildren(...s.scans.map((v,i)=>{let d=document.createElement('div');d.className='scan';d.textContent=`${i+1}. 左 ${v.left.toFixed(2)} m / 右 ${v.right.toFixed(2)} m → ${v.choice}`;return d}));s.depth.forEach((row,y)=>row.forEach((d,x)=>{dc.fillStyle=d>=4?'#40525a':`hsl(${Math.min(120,d/3*120)} 95% 43%)`;dc.fillRect(x,y,1,1)}));}}catch(e){$('error').textContent='等待本地仿真服务…'}setTimeout(poll,150)}poll();
</script></body></html>
